server {
    listen 80;
    server_name lowcaloriesjordan.com www.lowcaloriesjordan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name lowcaloriesjordan.com www.lowcaloriesjordan.com;

    # 🔴 TODO: مسارات شهادة SSL الحقيقية (Let's Encrypt عبر certbot مجاني وسهل)
    ssl_certificate     /etc/letsencrypt/live/lowcaloriesjordan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lowcaloriesjordan.com/privkey.pem;

    client_max_body_size 10M;  # يسمح برفع صور منيو من لوحة التحكم

    location /static/ {
        alias /var/www/lowcalories/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/lowcalories/media/;
        expires 30d;
    }

    location / {
        proxy_pass http://unix:/run/lowcalories/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # ضروري عشان SECURE_PROXY_SSL_HEADER يشتغل صح
    }
}
