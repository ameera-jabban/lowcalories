version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lowcalories
      POSTGRES_USER: lowcalories
      POSTGRES_PASSWORD: lowcalories_local_password  # 🔴 غيّرها بالإنتاج
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lowcalories"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-CHANGE-ME}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://lowcalories:lowcalories_local_password@db:5432/lowcalories
      REDIS_URL: redis://redis:6379/1
      DJANGO_SECURE_SSL_REDIRECT: "False"  # فعّلها True لما يصير عندك SSL حقيقي قدام nginx
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  media_data:
  static_data:
